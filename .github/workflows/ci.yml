name: ci

on:
  push:
    branches: [main, python-rewrite]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: murder-api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: murder
          POSTGRES_DB: murder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d murder"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Integration tests run against the real Postgres service (default is in-memory SQLite).
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:murder@localhost:5432/murder
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=src --cov-report=term-missing --cov-report=xml
      - uses: codecov/codecov-action@v5
        with:
          files: murder-api/coverage.xml
        continue-on-error: true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: murder-front
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: murder-front/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --watch=false --browsers=ChromeHeadless

  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t murder-api ./murder-api
      - run: docker build -t murder-front ./murder-front
