name: ci

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: murder-api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: murder
          POSTGRES_DB: murder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d murder"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # The whole suite runs on the real Postgres (default is in-memory SQLite). That also enables
      # the PostgreSQL-only tests: concurrent writers without the app lock, Alembic migrations on
      # throwaway databases (the CI user is a superuser, so it may CREATE DATABASE).
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:murder@localhost:5432/murder
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: murder-api/requirements.txt
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: ruff format --check .
      # the e2e suite and helper scripts follow the API's ruff settings
      - run: ruff check --config pyproject.toml ../e2e ../scripts
      - run: ruff format --check --config pyproject.toml ../e2e ../scripts
      # Apply migrations to the real Postgres, then fail if the models have drifted
      # from the recorded migrations (the guard for the max_players-style schema gap).
      - run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:murder@localhost:5432/murder
      - run: alembic check
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:murder@localhost:5432/murder
      - run: pytest --cov=src --cov-report=term-missing --cov-report=xml
      - uses: codecov/codecov-action@v5
        with:
          files: murder-api/coverage.xml
        continue-on-error: true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: murder-front
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: murder-front/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --watch=false --browsers=ChromeHeadlessNoSandbox

  # The production-like stack (docker compose: nginx + API + PostgreSQL, images built from the
  # Dockerfiles) driven end to end: REST + WebSocket through nginx, nginx headers/caching, and
  # two players in real Chromium. Also proves both Docker images build and start.
  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            murder-api/requirements.txt
            requirements-e2e.txt
      - run: pip install -r murder-api/requirements.txt -r requirements-e2e.txt
      - run: python -m playwright install --with-deps chromium
      - run: scripts/e2e.sh compose
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: e2e/test-results/
          retention-days: 7
