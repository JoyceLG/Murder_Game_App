# End-to-end suite: runs against a live stack (see TESTING.md / scripts/e2e.sh).
[pytest]
testpaths = .
markers =
    nginx: checks that only apply behind the production nginx front (compose stack)
    browser: drives the real Angular UI in Chromium
addopts =
    -p no:cacheprovider
    --browser chromium
    --screenshot only-on-failure
    --tracing retain-on-failure
    --output test-results
