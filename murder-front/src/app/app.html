<header class="mast">
  <div class="brand"><span class="dot"></span><b>MURDER</b></div>
  <div class="meta">
    <span class="lang">
      @for (l of lang.supported; track l) {
        <button
          type="button"
          class="lang-btn"
          [class.on]="lang.current() === l"
          (click)="setLang(l)"
        >
          {{ l }}
        </button>
      }
    </span>
    <span class="tagline">{{ 'app.tagline' | transloco }} {{ session.code() || '—' }}</span>
  </div>
</header>

<main class="client">
  <router-outlet />
</main>

@if (toast.current(); as t) {
  <div id="toast" class="show" [class.bad]="t.kind === 'bad'" [class.good]="t.kind === 'good'">
    {{ t.text }}
  </div>
}
