# Map the Upgrade header so the same proxy block handles both REST and WebSocket.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Security headers (inherited by every location below: none of them uses add_header).
  # style-src needs 'unsafe-inline' for Angular component styles; scripts are same-origin only
  # (critical-CSS inlining, which needs an inline onload handler, is disabled in angular.json).
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # SPA deep-link fallback: unknown paths serve index.html. Never cached, so a deploy is
  # picked up on the next load (index.html points at the new hashed bundles).
  location / {
    try_files $uri $uri/ /index.html;
    expires -1;
  }

  # Translations are not content-hashed: always revalidate.
  location /i18n/ {
    expires -1;
  }

  # Content-hashed bundles (outputHashing: all) can be cached for good.
  location ~* \.(?:js|css)$ {
    try_files $uri =404;
    expires 1y;
  }

  # REST + WebSocket (/games and /games/{code}/live) -> FastAPI service.
  location /games {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # A live game socket can sit idle between pushes; the client also pings every 25 s.
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  location /health {
    proxy_pass http://api:8000;
  }
}
