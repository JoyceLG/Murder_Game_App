# Map the Upgrade header so the same proxy block handles both REST and WebSocket.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA deep-link fallback: unknown paths serve index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # REST + WebSocket (/games and /games/{code}/live) -> FastAPI service.
  location /games {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  location /health {
    proxy_pass http://api:8000;
  }
}
