services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: murder
      POSTGRES_DB: murder
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d murder"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./murder-api
    environment:
      # Setting DATABASE_URL flips the repository adapter from in-memory to PostgreSQL.
      DATABASE_URL: postgresql+asyncpg://postgres:murder@postgres:5432/murder
      # The front (nginx) is same-origin, so CORS only matters for `ng serve` on :4200.
      ALLOWED_ORIGINS: http://localhost:4200
      # Trust X-Forwarded-For from the nginx container so rate limits apply per real client.
      # (Port 8000 is also published for Swagger: direct callers could spoof the header — keep
      # it unpublished in any real deployment.)
      FORWARDED_ALLOW_IPS: "*"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  front:
    build: ./murder-front
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pg_data:
