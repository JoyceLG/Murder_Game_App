# Alembic configuration for the Murder API.
#
# The database URL is NOT hardcoded here (12-factor): env.py reads it from the
# DATABASE_URL environment variable, falling back to sqlalchemy.url below only
# for tooling that sets it explicitly. Keep secrets out of this file.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# Left blank on purpose — env.py resolves the URL from DATABASE_URL at runtime.
sqlalchemy.url =

[post_write_hooks]
# Format newly generated migrations with ruff (matches the project's formatter).
hooks = ruff_format
ruff_format.type = console_scripts
ruff_format.entrypoint = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
